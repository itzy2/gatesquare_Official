<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4511e">

<title>SUSHI DAY | 予約システム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#fff7f0;
  color:#222;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

header {
  background:#f4511e;
  color:white;
  padding:25px;
  text-align:center;
}

header h1 { margin:0; font-size:32px; }

.container {
  max-width:850px;
  margin:auto;
  padding:20px;
}

.card {
  background:white;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 4px 15px #0001;
}

input,button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  font-size:15px;
}

input { border:1px solid #ddd; }

button {
  background:#f4511e;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:disabled {
  background:#aaa;
  cursor:not-allowed;
}

.secondary { background:#555; }
.cancel { background:#777; }

.day {
  padding:16px;
  border:1px solid #eee;
  border-radius:12px;
  margin-bottom:12px;
}

.available { color:#16803c; }
.reserved { color:#e53935; }

.hidden { display:none; }

.status {
  background:#fff1e8;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}

footer {
  text-align:center;
  padding:25px;
  color:#888;
}
</style>
</head>

<body>

<header>
  <h1>🍣 SUSHI DAY</h1>
  <p>1日1人限定！早い者勝ち予約システム</p>
</header>

<div class="container">

<section class="card" id="loginArea">
  <h2>ログイン・新規登録</h2>

  <input id="name" placeholder="名前（新規登録時）">
  <input id="email" type="email" placeholder="メールアドレス">
  <input id="password" type="password" placeholder="パスワード">

  <button onclick="signup()">新規登録</button>
  <button class="secondary" onclick="login()">ログイン</button>

  <div class="status" id="message">友達10人限定の予約サイト</div>
</section>

<section class="card hidden" id="userArea">
  <h2>こんにちは、<span id="userName"></span> さん！</h2>
  <button class="secondary" onclick="logout()">ログアウト</button>
</section>

<section class="card hidden" id="reservationArea">
  <h2>📅 予約カレンダー</h2>
  <p>今日から2ヶ月後まで予約できます。</p>
  <div id="calendar">読み込み中...</div>
</section>

<section class="card hidden" id="myArea">
  <h2>🎫 自分の予約</h2>
  <div id="myReservation"></div>
</section>

<section class="card hidden" id="historyArea">
  <h2>📋 みんなの予約状況</h2>
  <div id="history"></div>
</section>

</div>

<footer>SUSHI DAY © 2026</footer>

<script>

// ========================================
// Supabase接続設定
// ========================================

// SupabaseのProject URLを入力
const SUPABASE_URL = "ここにSupabaseのProject URL";

// SupabaseのPublishable keyを入力
const SUPABASE_KEY = "ここにSupabaseのPublishable key";

// 接続
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

// ========================================
// 日付処理
// ========================================

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function dateText(date) {
  return new Date(date+"T00:00:00").toLocaleDateString(
    "ja-JP",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"short"
    }
  );
}

function today() {
  return formatDate(new Date());
}

function endDate() {
  const d = new Date();
  d.setMonth(d.getMonth()+2);
  return formatDate(d);
}

// ========================================
// 画面表示
// ========================================

function show(id,visible) {
  document.getElementById(id)
    .classList.toggle("hidden",!visible);
}

function message(text) {
  document.getElementById("message").textContent=text;
}

// ========================================
// 新規登録
// ========================================

async function signup() {

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!name || !email || !password) {
    message("すべて入力してください");
    return;
  }

  const {error}=await supabaseClient.auth.signUp({
    email,
    password,
    options:{
      data:{display_name:name}
    }
  });

  if(error) {
    message(error.message);
    return;
  }

  message("登録しました。メール確認が必要な場合があります。");
}

// ========================================
// ログイン
// ========================================

async function login() {

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  const {error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error) {
    message(error.message);
    return;
  }

  await initialize();
}

// ========================================
// ログアウト
// ========================================

async function logout() {
  await supabaseClient.auth.signOut();
  await initialize();
}

// ========================================
// 初期化
// ========================================

async function initialize() {

  const {data,error}=await supabaseClient.auth.getUser();

  if(error) {
    console.error(error);
  }

  currentUser=data?.user || null;

  show("loginArea",!currentUser);
  show("userArea",!!currentUser);
  show("reservationArea",!!currentUser);
  show("myArea",!!currentUser);
  show("historyArea",!!currentUser);

  if(!currentUser) return;

  const {data:profile,error:profileError}=await supabaseClient
    .from("profiles")
    .select("display_name")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(profileError) {
    alert("プロフィール取得エラー："+profileError.message);
    return;
  }

  document.getElementById("userName").textContent=
    profile?.display_name || "ユーザー";

  await loadCalendar();
  await loadMyReservation();
  await loadHistory();
}

// ========================================
// 予約カレンダー
// ========================================

async function loadCalendar() {

  const {data,error}=await supabaseClient
    .from("daily_reservations")
    .select("*")
    .gte("reservation_date",today())
    .lte("reservation_date",endDate())
    .order("reservation_date");

  const area=document.getElementById("calendar");

  if(error) {
    area.textContent="予約情報を取得できません："+error.message;
    return;
  }

  const reservations={};

  (data||[]).forEach(r=>{
    reservations[r.reservation_date]=r;
  });

  area.innerHTML="";

  const start=new Date();
  const end=new Date();
  end.setMonth(end.getMonth()+2);

  for(
    let d=new Date(start);
    d<=end;
    d.setDate(d.getDate()+1)
  ) {

    const date=formatDate(d);
    const reservation=reservations[date];

    const div=document.createElement("div");
    div.className="day";

    const title=document.createElement("h3");
    title.textContent=dateText(date);

    const status=document.createElement("p");

    if(reservation) {

      status.className="reserved";
      status.textContent="🔴 予約済み";

      const owner=document.createElement("p");
      owner.textContent="予約者："+reservation.display_name;

      div.append(title,status,owner);

    } else {

      status.className="available";
      status.textContent="🟢 予約受付中";

      const btn=document.createElement("button");
      btn.textContent="この日を予約する";
      btn.onclick=()=>reserve(date);

      div.append(title,status,btn);
    }

    area.appendChild(div);
  }
}

// ========================================
// 予約実行
// ========================================

async function reserve(date) {

  if(!confirm(dateText(date)+"を予約しますか？")) return;

  const {data,error}=await supabaseClient.rpc(
    "reserve_day",
    {p_date:date}
  );

  if(error) {
    alert("予約エラー："+error.message);
    return;
  }

  const result=data?.[0];

  if(result?.success) {
    alert("🎉 予約成功！\n"+dateText(date));
  } else {
    alert("予約できませんでした。\n"+(result?.message||"予約済みです"));
  }

  await refresh();
}

// ========================================
// 自分の予約
// ========================================

async function loadMyReservation() {

  const {data,error}=await supabaseClient
    .from("daily_reservations")
    .select("*")
    .eq("user_id",currentUser.id)
    .gte("reservation_date",today())
    .order("reservation_date");

  const area=document.getElementById("myReservation");
  area.innerHTML="";

  if(error || !data || data.length===0) {
    area.textContent="現在予約はありません。";
    return;
  }

  data.forEach(r=>{

    const div=document.createElement("div");
    div.className="day";

    const title=document.createElement("h3");
    title.textContent=dateText(r.reservation_date);

    const btn=document.createElement("button");
    btn.className="cancel";
    btn.textContent="予約をキャンセル";

    btn.onclick=async()=>{

      if(!confirm("予約をキャンセルしますか？")) return;

      const {data:result,error}=await supabaseClient.rpc(
        "cancel_day",
        {p_date:r.reservation_date}
      );

      if(error) {
        alert(error.message);
        return;
      }

      alert(result ? "キャンセルしました" : "キャンセルできませんでした");

      await refresh();
    };

    div.append(title,btn);
    area.appendChild(div);
  });
}

// ========================================
// 全体の予約状況
// ========================================

async function loadHistory() {

  const {data,error}=await supabaseClient
    .from("daily_reservations")
    .select("*")
    .gte("reservation_date",today())
    .order("reservation_date");

  const area=document.getElementById("history");
  area.innerHTML="";

  if(error) {
    area.textContent="取得エラー："+error.message;
    return;
  }

  if(!data || data.length===0) {
    area.textContent="まだ予約はありません。";
    return;
  }

  data.forEach(r=>{

    const div=document.createElement("div");
    div.className="day";

    const title=document.createElement("h3");
    title.textContent=dateText(r.reservation_date);

    const owner=document.createElement("p");
    owner.textContent="予約者："+r.display_name;

    div.append(title,owner);
    area.appendChild(div);
  });
}

// ========================================
// 更新
// ========================================

async function refresh() {
  await loadCalendar();
  await loadMyReservation();
  await loadHistory();
}

// ========================================
// 起動
// ========================================

supabaseClient.auth.onAuthStateChange(()=>{
  setTimeout(initialize,0);
});

initialize();

</script>

</body>
</html>
