
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gatesquare公式 | 予約システム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --orange: #f97316;
  --orange-dark: #ea580c;
  --bg: #fff7ed;
  --text: #292524;
  --muted: #78716c;
  --border: #fed7aa;
  --white: #ffffff;
  --green: #15803d;
  --red: #dc2626;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans JP", sans-serif;
}

header {
  background: var(--orange);
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 2px;
}

header p {
  margin: 8px 0 0;
}

main {
  width: min(950px, 94%);
  margin: 25px auto 60px;
}

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 4px 14px rgba(120, 53, 15, 0.06);
}

h2 {
  margin: 0 0 18px;
  font-size: 20px;
}

.notice {
  background: #ffedd5;
  border-radius: 12px;
  padding: 15px;
  line-height: 1.8;
  margin-bottom: 20px;
}

.user-name {
  color: var(--orange-dark);
  font-weight: bold;
}

label {
  display: block;
  font-weight: bold;
  margin: 14px 0 7px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

button {
  border: none;
  border-radius: 9px;
  padding: 12px 18px;
  background: var(--orange);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: var(--orange-dark);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.primary-button {
  width: 100%;
  margin-top: 18px;
  padding: 15px;
}

.cancel-button {
  background: var(--red);
  padding: 8px 12px;
  font-size: 13px;
}

.slot-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin-top: 15px;
}

.slot {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  background: #fffaf5;
}

.slot-time {
  font-size: 17px;
  font-weight: bold;
}

.slot-detail {
  color: var(--muted);
  font-size: 13px;
  margin: 6px 0 10px;
}

.slot.reserved {
  background: #f5f5f4;
  border-color: #d6d3d1;
}

.slot.reserved .slot-time {
  color: var(--muted);
}

.status {
  font-size: 13px;
  font-weight: bold;
  color: var(--green);
}

.status.full {
  color: var(--red);
}

.reservation-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #eee;
  padding: 13px 0;
}

.reservation-row:last-child {
  border-bottom: none;
}

.reservation-info {
  line-height: 1.7;
}

.reservation-info strong {
  color: var(--orange-dark);
}

.empty {
  color: var(--muted);
  padding: 12px 0;
}

.message {
  padding: 13px;
  border-radius: 9px;
  margin-top: 15px;
  display: none;
  line-height: 1.6;
}

.message.error {
  display: block;
  color: #991b1b;
  background: #fee2e2;
}

.message.success {
  display: block;
  color: #166534;
  background: #dcfce7;
}

.small {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

footer {
  text-align: center;
  color: var(--muted);
  padding: 25px;
  font-size: 13px;
}

@media (max-width: 550px) {
  header h1 {
    font-size: 25px;
  }

  .card {
    padding: 17px;
  }

  .reservation-row {
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<header>
  <h1>SUSHI DAY</h1>
  <p>予約システム</p>
</header>

<main>

  <section class="card">
    <h2>ログイン情報</h2>
    <div id="userStatus">ログイン状態を確認しています...</div>
  </section>

  <section class="card">
    <h2>予約について</h2>
    <div class="notice">
      <strong>予約時間：60分</strong><br>
      入れ替え時間：10分<br>
      予約間隔：70分<br>
      受付時間：10:00～20:00<br>
      予約可能期間：今日から2か月先まで
    </div>
    <p class="small">
      同じ日・同じ時間枠には1人だけ予約できます。
      予約が完了すると、予約一覧にユーザー名が表示されます。
    </p>
  </section>

  <section class="card">
    <h2>予約する</h2>

    <label for="reservationDate">予約日</label>
    <input type="date" id="reservationDate">

    <label for="reservationTime">予約時間</label>
    <select id="reservationTime">
      <option value="">予約時間を選択してください</option>
    </select>

    <button class="primary-button" id="reserveButton">
      この内容で予約する
    </button>

    <div id="message" class="message"></div>
  </section>

  <section class="card">
    <h2>選択日の予約状況</h2>
    <div id="slotList" class="slot-list">
      日付を選択してください。
    </div>
  </section>

  <section class="card">
    <h2>みんなの予約一覧</h2>
    <div id="allReservations">
      読み込み中...
    </div>
  </section>

  <section class="card">
    <h2>自分の予約</h2>
    <div id="myReservations">
      読み込み中...
    </div>
  </section>

</main>

<footer>
  SUSHI DAY Reservation System
</footer>

<script>
const SUPABASE_URL =
  "https://hxrtpftlklgwesvanlpk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const SLOT_STARTS = [
  "10:00",
  "11:10",
  "12:20",
  "13:30",
  "14:40",
  "15:50",
  "17:00",
  "18:10"
];

let currentUser = null;
let currentDisplayName = "";

const dateInput = document.getElementById("reservationDate");
const timeSelect = document.getElementById("reservationTime");
const slotList = document.getElementById("slotList");
const messageBox = document.getElementById("message");

function localDateString(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function addMonths(date, months) {
  const result = new Date(date);
  const originalDay = result.getDate();

  result.setDate(1);
  result.setMonth(result.getMonth() + months);

  const lastDay = new Date(
    result.getFullYear(),
    result.getMonth() + 1,
    0
  ).getDate();

  result.setDate(Math.min(originalDay, lastDay));
  return result;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function endTime(start) {
  const [hour, minute] = start.split(":").map(Number);
  const total = hour * 60 + minute + 60;

  const h = String(Math.floor(total / 60)).padStart(2, "0");
  const m = String(total % 60).padStart(2, "0");

  return `${h}:${m}`;
}

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = "message " + type;
}

function clearMessage() {
  messageBox.textContent = "";
  messageBox.className = "message";
}

function initializeDateInput() {
  const today = new Date();
  const maxDate = addMonths(today, 2);

  dateInput.min = localDateString(today);
  dateInput.max = localDateString(maxDate);
  dateInput.value = localDateString(today);
}

function initializeTimeSelect() {
  timeSelect.innerHTML =
    '<option value="">予約時間を選択してください</option>';

  SLOT_STARTS.forEach(start => {
    const option = document.createElement("option");
    option.value = start;
    option.textContent =
      `${start} ～ ${endTime(start)}（60分）`;
    timeSelect.appendChild(option);
  });
}

async function loadUser() {
  const { data, error } = await db.auth.getUser();

  if (error || !data.user) {
    currentUser = null;

    document.getElementById("userStatus").innerHTML =
      '<span style="color:#dc2626">ログインしていません。先にログインしてください。</span>';

    document.getElementById("reserveButton").disabled = true;
    return false;
  }

  currentUser = data.user;

  const { data: profile, error: profileError } = await db
    .from("profiles")
    .select("display_name")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (profileError) {
    document.getElementById("userStatus").textContent =
      "プロフィールを取得できませんでした。";
    document.getElementById("reserveButton").disabled = true;
    return false;
  }

  currentDisplayName =
    profile?.display_name?.trim() ||
    currentUser.user_metadata?.display_name ||
    "";

  if (!currentDisplayName) {
    document.getElementById("userStatus").textContent =
      "ユーザー名が登録されていません。プロフィールを設定してください。";
    document.getElementById("reserveButton").disabled = true;
    return false;
  }

  document.getElementById("userStatus").innerHTML =
    `ログイン中：<span class="user-name">${escapeHTML(currentDisplayName)}</span>`;

  document.getElementById("reserveButton").disabled = false;
  return true;
}

async function getReservations(date) {
  const { data, error } = await db
    .from("time_slot_reservations")
    .select("id, reservation_date, slot_start, user_id, display_name")
    .eq("reservation_date", date)
    .order("slot_start", { ascending: true });

  if (error) {
    throw error;
  }

  return data || [];
}

async function loadSlotList() {
  const date = dateInput.value;

  if (!date) {
    slotList.textContent = "予約日を選択してください。";
    return;
  }

  slotList.innerHTML = "読み込み中...";

  try {
    const reservations = await getReservations(date);

    const byTime = new Map(
      reservations.map(item => [
        item.slot_start.slice(0, 5),
        item
      ])
    );

    slotList.innerHTML = "";

    SLOT_STARTS.forEach(start => {
      const reservation = byTime.get(start);
      const box = document.createElement("div");

      box.className = "slot" + (reservation ? " reserved" : "");

      if (reservation) {
        box.innerHTML = `
          <div class="slot-time">
            ${start} ～ ${endTime(start)}
          </div>
          <div class="slot-detail">60分予約・10分入れ替え</div>
          <div class="status full">予約済み</div>
          <div>予約者：${escapeHTML(reservation.display_name)}</div>
        `;
      } else {
        box.innerHTML = `
          <div class="slot-time">
            ${start} ～ ${endTime(start)}
          </div>
          <div class="slot-detail">60分予約・10分入れ替え</div>
          <div class="status">予約可能</div>
        `;
      }

      slotList.appendChild(box);
    });

    timeSelect.value = "";
  } catch (error) {
    slotList.textContent =
      "予約状況を取得できませんでした：" + error.message;
  }
}

async function reserve() {
  clearMessage();

  if (!currentUser) {
    showMessage("ログインしてください。", "error");
    return;
  }

  const date = dateInput.value;
  const start = timeSelect.value;

  if (!date || !start) {
    showMessage("予約日と予約時間を選択してください。", "error");
    return;
  }

  const today = localDateString(new Date());
  const maxDate = localDateString(addMonths(new Date(), 2));

  if (date < today || date > maxDate) {
    showMessage("予約できるのは今日から2か月先までです。", "error");
    return;
  }

  const button = document.getElementById("reserveButton");
  button.disabled = true;
  button.textContent = "予約処理中...";

  try {
    const { data, error } = await db.rpc("reserve_time_slot", {
      p_date: date,
      p_start_time: start
    });

    if (error) {
      throw error;
    }

    showMessage(
      `${date} ${start}～${endTime(start)} の予約が完了しました。`,
      "success"
    );

    await refreshAll();
  } catch (error) {
    showMessage(
      error.message || "予約に失敗しました。",
      "error"
    );
    await refreshAll();
  } finally {
    button.disabled = !currentUser;
    button.textContent = "この内容で予約する";
  }
}

async function loadAllReservations() {
  const area = document.getElementById("allReservations");

  const today = localDateString(new Date());
  const maxDate = localDateString(addMonths(new Date(), 2));

  const { data, error } = await db
    .from("time_slot_reservations")
    .select("id, reservation_date, slot_start, display_name")
    .gte("reservation_date", today)
    .lte("reservation_date", maxDate)
    .order("reservation_date", { ascending: true })
    .order("slot_start", { ascending: true });

  if (error) {
    area.textContent =
      "予約一覧を取得できませんでした：" + error.message;
    return;
  }

  if (!data || data.length === 0) {
    area.innerHTML = '<p class="empty">現在、予約はありません。</p>';
    return;
  }

  area.innerHTML = data.map(item => `
    <div class="reservation-row">
      <div class="reservation-info">
        <strong>${escapeHTML(item.reservation_date)}</strong><br>
        ${escapeHTML(item.slot_start.slice(0, 5))}
        ～ ${endTime(item.slot_start.slice(0, 5))}<br>
        予約者：${escapeHTML(item.display_name)}
      </div>
    </div>
  `).join("");
}

async function loadMyReservations() {
  const area = document.getElementById("myReservations");

  if (!currentUser) {
    area.innerHTML =
      '<p class="empty">ログインすると自分の予約を確認できます。</p>';
    return;
  }

  const today = localDateString(new Date());
  const maxDate = localDateString(addMonths(new Date(), 2));

  const { data, error } = await db
    .from("time_slot_reservations")
    .select("id, reservation_date, slot_start, display_name")
    .eq("user_id", currentUser.id)
    .gte("reservation_date", today)
    .lte("reservation_date", maxDate)
    .order("reservation_date", { ascending: true })
    .order("slot_start", { ascending: true });

  if (error) {
    area.textContent =
      "自分の予約を取得できませんでした：" + error.message;
    return;
  }

  if (!data || data.length === 0) {
    area.innerHTML =
      '<p class="empty">現在、自分の予約はありません。</p>';
    return;
  }

  area.innerHTML = data.map(item => `
    <div class="reservation-row">
      <div class="reservation-info">
        <strong>${escapeHTML(item.reservation_date)}</strong><br>
        ${escapeHTML(item.slot_start.slice(0, 5))}
        ～ ${endTime(item.slot_start.slice(0, 5))}
      </div>
      <button
        class="cancel-button"
        data-id="${escapeHTML(item.id)}"
        type="button"
      >キャンセル</button>
    </div>
  `).join("");

  area.querySelectorAll(".cancel-button").forEach(button => {
    button.addEventListener("click", () => {
      cancelReservation(button.dataset.id);
    });
  });
}

async function cancelReservation(id) {
  if (!confirm("この予約をキャンセルしますか？")) {
    return;
  }

  try {
    const { error } = await db.rpc("cancel_time_slot", {
      p_reservation_id: id
    });

    if (error) {
      throw error;
    }

    showMessage("予約をキャンセルしました。", "success");
    await refreshAll();
  } catch (error) {
    showMessage(
      error.message || "キャンセルできませんでした。",
      "error"
    );
  }
}

async function refreshAll() {
  await Promise.all([
    loadSlotList(),
    loadAllReservations(),
    loadMyReservations()
  ]);
}

dateInput.addEventListener("change", async () => {
  clearMessage();
  await loadSlotList();
});

document.getElementById("reserveButton")
  .addEventListener("click", reserve);

async function start() {
  initializeDateInput();
  initializeTimeSelect();

  const loggedIn = await loadUser();

  if (loggedIn) {
    await refreshAll();
  } else {
    slotList.textContent = "ログイン後に予約状況を表示します。";
    document.getElementById("allReservations").textContent =
      "ログイン後に予約一覧を表示します。";
    document.getElementById("myReservations").textContent =
      "ログイン後に自分の予約を表示します。";
  }

  db.auth.onAuthStateChange(async () => {
    await loadUser();
    await refreshAll();
  });
}

start();
</script>

</body>
</html>
