<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻雀21 | CPU対戦</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>麻雀21</h1>
  <p>CPU対戦・レベル1～21</p>
</header>

<div class="settings">
  <label>CPUレベル</label>
  <select id="cpuLevel"></select>
  <button id="startBtn">対局開始</button>
  <button id="resetBtn">局をやり直す</button>
</div>

<main class="mahjongTable">

  <div class="cpu cpu-north">
    <h3>CPU 北</h3>
    <p id="scoreNorth">25000点</p>
    <div id="handNorth"></div>
  </div>

  <div class="cpu cpu-west">
    <h3>CPU 西</h3>
    <p id="scoreWest">25000点</p>
    <div id="handWest"></div>
  </div>

  <div class="cpu cpu-east">
    <h3>CPU 東</h3>
    <p id="scoreEast">25000点</p>
    <div id="handEast"></div>
  </div>

  <div class="centerInfo">
    <h2 id="round">東一局</h2>
    <p>残り牌：<span id="remaining">70</span></p>
    <p id="turnInfo">対局開始してください</p>
    <div id="river"></div>
  </div>

  <div class="player">
    <h2>あなた</h2>
    <p id="playerScore">25000点</p>
    <div id="playerHand" class="hand"></div>
  </div>

</main>

<div class="controls">
  <button id="drawBtn">ツモ</button>
  <button id="reachBtn">リーチ</button>
  <button id="ronBtn">ロン</button>
  <button id="tsumoBtn">ツモ和了</button>
  <button id="sortBtn">手牌整理</button>
</div>

<div id="message">CPUレベルを選んで対局開始してください。</div>

<script src="mahjong.js"></script>
<script src="cpu.js"></script>
<script src="app.js"></script>

</body>
</html>
